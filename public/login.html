<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Login | Attendance System</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --line:#334155; --text:#f8fafc; --muted:#94a3b8; --primary:#2563eb; --primary-hover:#1d4ed8; --red:#ef4444; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Inter, system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: grid; place-items: center; padding: 20px; }
  .login-card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 36px 32px; width: 100%; max-width: 400px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.4); }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 24px; }
  .brand-icon { width: 38px; height: 38px; border-radius: 10px; background: var(--primary); display: grid; place-items: center; font-size: 20px; }
  h1 { font-size: 20px; font-weight: 700; }
  p.sub { color: var(--muted); font-size: 13px; margin-top: 4px; margin-bottom: 24px; }
  label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 8px; }
  input { width: 100%; padding: 12px 14px; background: #0f172a; border: 1px solid var(--line); border-radius: 10px; color: #fff; font-size: 14px; margin-bottom: 18px; outline: none; transition: border-color .15s; }
  input:focus { border-color: var(--primary); }
  button { width: 100%; padding: 12px; background: var(--primary); color: #fff; border: none; border-radius: 10px; font-weight: 600; font-size: 14px; cursor: pointer; transition: background .15s; }
  button:hover { background: var(--primary-hover); }
  button:disabled { opacity: 0.6; cursor: wait; }
  .err { color: var(--red); font-size: 13px; margin-top: 14px; text-align: center; min-height: 18px; }
  .footer-links { text-align: center; margin-top: 24px; }
  .footer-links a { color: var(--muted); text-decoration: none; font-size: 13px; transition: color .15s; }
  .footer-links a:hover { color: var(--text); }
  .default-hint { background: rgba(37,99,235,0.1); border: 1px solid rgba(37,99,235,0.25); border-radius: 8px; padding: 10px 12px; font-size: 12px; color: #93c5fd; margin-bottom: 20px; }
</style>
</head>
<body>

<div class="login-card">
  <div class="brand">
    <div class="brand-icon">🔒</div>
    <div>
      <h1>Admin Login</h1>
      <p class="sub">Attendance Management System</p>
    </div>
  </div>

  <div class="default-hint">
    <strong>Default Credentials:</strong><br>
    Username: <code>admin</code> &nbsp;|&nbsp; Password: <code>admin123</code>
  </div>

  <form id="loginForm">
    <label for="username">Username</label>
    <input type="text" id="username" placeholder="admin" required autofocus value="admin">

    <label for="password">Password</label>
    <input type="password" id="password" placeholder="Enter password" required>

    <button type="submit" id="loginBtn">Login to Admin Panel</button>
    <div class="err" id="errMsg"></div>
  </form>

  <div class="footer-links">
    <a href="/">← Back to Kiosk (Public Attendance)</a>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const form = $('loginForm');
const btn = $('loginBtn');
const err = $('errMsg');

const urlParams = new URLSearchParams(window.location.search);
const redirectUrl = urlParams.get('redirect') || '/dashboard.html';

// If already logged in and token is valid, redirect directly
const existingToken = localStorage.getItem('admin_token');
if (existingToken) {
  fetch('/api/auth/verify', {
    headers: { 'Authorization': 'Bearer ' + existingToken }
  }).then(r => r.json()).then(data => {
    if (data.ok) window.location.href = redirectUrl;
  }).catch(() => {});
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  err.textContent = '';
  btn.disabled = true;
  btn.textContent = 'Verifying...';

  const username = $('username').value.trim();
  const password = $('password').value;

  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Login failed');

    localStorage.setItem('admin_token', data.token);
    localStorage.setItem('admin_user', data.username);
    window.location.href = redirectUrl;
  } catch (ex) {
    err.textContent = ex.message;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Login to Admin Panel';
  }
});
</script>
</body>
</html>
